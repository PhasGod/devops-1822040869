name: CI/CD Website Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Kiểm tra tính hợp lệ của mã nguồn
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiem tra du 3 tap tin can thiet
        run: |
          echo "Kiem tra su ton tai cua cac file..."
          test -f index.html || { echo "Loi: Thieu file index.html"; exit 1; }
          test -f style.css || { echo "Loi: Thieu file style.css"; exit 1; }
          test -f script.js || { echo "Loi: Thieu file script.js"; exit 1; }
          echo "Da du 3 file: index.html, style.css, script.js."

      - name: Kiem tra the <title> trong index.html
        run: |
          echo "Kiem tra the <title>..."
          grep -qi "<title>.*</title>" index.html || { echo "Loi: index.html thieu the <title>"; exit 1; }
          echo "The <title> hop le."

  # Job 2: Triển khai lên GitHub Pages (chỉ chạy khi job check thành công)
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4